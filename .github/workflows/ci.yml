name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Una vez por semana: aparecen vulnerabilidades nuevas aunque el código no cambie.
  schedule:
    - cron: "0 12 * * 1"

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - name: Vulnerabilidades conocidas (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    name: Backend (imagen Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen que usa Render
        run: docker build -t travel-planner-api backend

  frontend:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  dependencias-flutter:
    name: Vulnerabilidades (paquetes Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Escáner oficial de OSV (la base de vulnerabilidades de Google) sobre pubspec.lock.
      - uses: google/osv-scanner-action/osv-scanner-action@v2.3.0
        with:
          scan-args: --lockfile=frontend/pubspec.lock
