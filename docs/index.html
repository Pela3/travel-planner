<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Página estática: sin scripts ni recursos externos. GitHub Pages no deja configurar headers, así que la política va acá. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Travel Planner</title>
  <meta name="description" content="Travel Planner: armá tu viaje ciudad por ciudad con inteligencia artificial.">
  <style>
    :root { --bg: #ffffff; --texto: #1e293b; --suave: #475569; --acento: #0369a1; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b111e; --texto: #e2e8f0; --suave: #94a3b8; --acento: #38bdf8; } }
    body { margin: 0; background: var(--bg); color: var(--texto); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 56px 16px; text-align: center; }
    img { width: 128px; height: 128px; border-radius: 28px; }
    h1 { margin: 20px 0 8px; }
    p { color: var(--suave); }
    a { color: var(--acento); }
  </style>
</head>
<body>
<main>
  <img src="icono.png" alt="Ícono de Travel Planner">
  <h1>Travel Planner</h1>
  <p>Armá tu viaje ciudad por ciudad con inteligencia artificial: itinerario diario, presupuesto, clima y traslados.</p>
  <p><a href="privacidad/">Política de privacidad</a></p>
</main>
</body>
</html>
